name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YT Music ${{ github.ref_name }}'
          releaseBody: |
            Unofficial YouTube Music client. Not affiliated with Google LLC.

            **Windows:** `*_x64-setup.exe` · **macOS:** `*_aarch64.dmg` (Apple Silicon) / `*_x64.dmg` (Intel). The app isn't notarized, so right-click → Open on first launch · **Linux:** `.AppImage` / `.deb`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          TC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_INC="$(ls -d "$TC"/lib/clang/*/include | head -1)"
          # rquickjs-sys generates its bindings with bindgen on Android
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=$TC/sysroot -I$CLANG_INC"
          cd src-tauri
          npx --yes @tauri-apps/cli@2 android build --apk --target aarch64 --ci

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)"
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$APK" "YT.Music_${VERSION}_android-arm64.apk"
          gh release upload "$GITHUB_REF_NAME" "YT.Music_${VERSION}_android-arm64.apk" --clobber
