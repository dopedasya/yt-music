name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Third-party actions are pinned to full commit SHAs (supply-chain safety:
# the android job handles the release signing key). Comments show the version.
jobs:
  build:
    # Manual runs (workflow_dispatch) only check the Android build.
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YT Music ${{ github.ref_name }}'
          releaseBody: |
            Unofficial YouTube Music client. Not affiliated with Google LLC.

            **Windows:** `*_x64-setup.exe` · **macOS:** `*_aarch64.dmg` (Apple Silicon) / `*_x64.dmg` (Intel). The app isn't notarized, so right-click → Open on first launch · **Linux:** `.AppImage` / `.deb` · **Android:** `*_android-arm64.apk`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: android

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # rquickjs-sys (via rustypipe) generates its Android bindings with bindgen.
      # libclang must match the NDK's clang (NDK 27 ships clang 18).
      - name: libclang 18
        run: sudo apt-get update && sudo apt-get install -y libclang-18-dev

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          NDK="$(ls -d "$ANDROID_HOME"/ndk/27.* | sort -V | tail -1)"
          echo "Using NDK $NDK"
          export NDK_HOME="$NDK"
          export LIBCLANG_PATH=/usr/lib/llvm-18/lib
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          # bindgen detects include paths by asking a clang binary; point it at the
          # NDK's clang, otherwise the host's glibc headers leak into the Android build.
          export CLANG_PATH="$TC/bin/clang"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=$TC/sysroot"
          cd src-tauri
          npx --yes @tauri-apps/cli@2 android build --apk --target aarch64 --ci

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)"
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$APK" "YT.Music_${VERSION}_android-arm64.apk"
          gh release upload "$GITHUB_REF_NAME" "YT.Music_${VERSION}_android-arm64.apk" --clobber
